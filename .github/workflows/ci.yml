name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Python tests
        run: pytest -q

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('yaml', 'ggplot2', 'jsonlite', 'dplyr', 'readr'), repos='https://cloud.r-project.org')"

      - name: Run R renderer smoke
        run: |
          Rscript R/panel_renderer.R examples/specs/single_panel.yaml /tmp/r-figure-smoke
          test -f /tmp/r-figure-smoke/single_panel_hist.pdf
          test -f /tmp/r-figure-smoke/single_panel_hist.png
