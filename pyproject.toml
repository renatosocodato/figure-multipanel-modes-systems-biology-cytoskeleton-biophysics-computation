[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figure-multipanel-factory"
version = "0.1.4"
description = "Schema-driven universal multipanel figure factory for biology+computational pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "panelforge contributors" }]
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyarrow>=14.0.1"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pyyaml>=6.0"
]

[project.scripts]
panelforge = "panelforge.cli.app:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["panelforge*"]
